[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphwerk-gba"
version = "0.1.1"
description = "Safety-first localization, version-porting, quality-gate, and deterministic QA-bot toolkit for GBA Gen-3 ROM projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "Glyphwerk Contributors"},
]
keywords = ["gba", "rom-hacking", "localization", "translation", "quality-gates", "emulation", "mgba"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Localization",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
disasm = ["capstone>=5.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "capstone>=5.0.0"]

[project.scripts]
glyphwerk = "glyphwerk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glyphwerk*"]

[tool.setuptools.package-data]
"glyphwerk.codec" = ["font_widths_bpre.json"]
"glyphwerk.bot" = ["explorer.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
